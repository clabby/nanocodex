[package]
name = "nanocodex-screen-health"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nanocodex-cli-auth = { path = "../../bin/nanocodex/account-auth" }
futures-util = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
url = "2"
webrtc = "0.17.0"
