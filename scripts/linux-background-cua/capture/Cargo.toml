[package]
name = "nanocodex-hyprland-capture"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
[workspace]
[dependencies]
anyhow = "1"
libc = "0.2"
png = "0.17"
wayland-client = "0.31"
wayland-scanner = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
bitflags = "2"
wayland-backend = { version = "0.3", features = ["client_system"] }
socket2 = "0.6"
