name: Deploy selected API Workers without image builds
description: Release API source using immutable images already published independently
inputs:
  component:
    description: Force only this Worker for an independent image rollout
    default: ''
  astra-api-key:
    description: Existing Astra managed API credential
    default: ''
  astra-mpp-secret:
    description: Existing Astra MPP credential
    default: ''
  tempo-api-key:
    description: Existing Tempo API credential
    default: ''
runs:
  using: composite
  steps:
    - name: Skip superseded push
      id: current-release
      shell: bash
      run: node scripts/cloudflare/current-production-release.mjs
    - name: Select Workers changed since their successful deployments
      id: plan
      if: steps.current-release.outputs.active == 'true'
      shell: bash
      env:
        RELEASE_ONLY: ${{ inputs.component }}
      run: node scripts/cloudflare/release-plan.mjs plan
    - name: Reuse unchanged WASM outputs
      id: wasm
      if: steps.plan.outputs.wasm == 'true'
      uses: ./.github/actions/wasm-outputs
    # Start the WASM compilation now, overlapping Node setup, dependency install
    # and the early Worker phases. The later build-js-package.sh cargo call waits
    # on Cargo's target-dir lock and then finds everything fresh. Starting the
    # sccache server here (not under Turbo's filtered env) keeps the GHA backend.
    - name: Start WASM compilation in the background
      if: steps.plan.outputs.wasm == 'true' && steps.wasm.outputs.hit != 'true'
      shell: bash
      run: |
        sccache --start-server
        nohup cargo +1.97 build --locked -p nanocodex-wasm --target wasm32-unknown-unknown --profile wasm \
          > "$RUNNER_TEMP/wasm-cargo.log" 2>&1 &
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      if: steps.plan.outputs.workspace == 'true'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      if: steps.plan.outputs.any == 'true'
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install only selected application dependencies
      if: steps.plan.outputs.any == 'true'
      shell: bash
      run: node scripts/cloudflare/release-plan.mjs install --defer-astra
    - name: Deploy selected Workers and record successful releases
      id: release
      if: steps.plan.outputs.any == 'true'
      shell: bash
      env:
        RELEASE_ONLY: ${{ inputs.component }}
        ASTRA_MANAGED_API_KEY: ${{ inputs.astra-api-key }}
        ASTRA_MPP_SECRET: ${{ inputs.astra-mpp-secret }}
        TEMPO_API_KEY: ${{ inputs.tempo-api-key }}
      run: node scripts/cloudflare/release-workers.mjs
    - name: Retain verified WASM outputs
      if: ${{ !cancelled() && steps.release.outputs.wasm-built == 'true' && github.ref == 'refs/heads/master' }}
      uses: ./.github/actions/save-wasm-outputs
      with:
        key: ${{ steps.wasm.outputs.key }}
        cache-hit: ${{ steps.wasm.outputs.cache-hit }}
        rejected-artifact-id: ${{ steps.wasm.outputs.rejected-artifact-id }}
