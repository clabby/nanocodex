[package]
name = "nanocodex-claude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Typed Anthropic Messages protocol and streaming transport"

[features]
default = []
workspace-files = ["dep:nanocodex-tools", "nanocodex-tools/workspace-runtime"]

[dependencies]
nanocodex-tools = { path = "../nanocodex-tools", version = "0.6.5", default-features = false, optional = true }
futures-util.workspace = true
nanocodex-agent = { path = "../nanocodex-agent", version = "0.6.5", default-features = false }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
rustls.workspace = true

axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync"] }

[lints]
workspace = true
